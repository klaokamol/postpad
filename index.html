const THEME_VARS = ['bg', 'paper', 'paper-deep', 'ink', 'ink-soft', 'title', 'accent'];

function mixHex(a, b, t) {
  return a.match(/../g).map((h, k) => Math.round(parseInt(h, 16) * (1 - t) + parseInt(b.substr(k * 2, 2), 16) * t).toString(16).padStart(2, '0')).join('');
}

function applyTheme(i) {
  const colors = THEMES[i].split(' ');
  if (colors[5] === colors[6]) colors[5] = mixHex(colors[5], colors[1], .5);
  THEME_VARS.forEach((name, k) => document.documentElement.style.setProperty('--' + name, '#' + colors[k]));
  document.querySelector('meta[name="theme-color"]').content = '#' + colors[0];
  themeIcons(colors);
}

async function themeIcons([bg, paper, , ink, , title]) {
  try {
    const svg = (await (await fetch('icon.svg')).text())
      .replaceAll('#bcd0e8', '#' + bg).replaceAll('#f6eedc', '#' + paper)
      .replaceAll('#5a3b26', '#' + ink).replaceAll('#f29882', '#' + title);
    const img = new Image();
    img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
    await img.decode();
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 180;
    canvas.getContext('2d').drawImage(img, 0, 0, 180, 180);
    const png = canvas.toDataURL('image/png');
    document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(link => { link.href = png; });
  } catch {}
}

(() => {
  let last = -1;
  try { last = Number(localStorage.getItem('theme')); } catch {}
  let i;
  do i = Math.floor(Math.random() * THEMES.length); while (i === last);
  try { localStorage.setItem('theme', i); } catch {}
  applyTheme(i);
})();

    --ink-soft: #7a5843;
    --title: #f29882;
    --accent: #fcd36f;
    --ui: "Courier Prime", "IBM Plex Sans Thai Looped", ui-monospace, monospace;
    --text: "IBM Plex Sans Thai Looped", -apple-system, sans-serif;
    --press: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body, textarea { overscroll-behavior: none; }
  ::selection { background: var(--accent); color: var(--ink); }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: 20px 16px 0;
    background: var(--bg) radial-gradient(color-mix(in srgb, var(--ink) 12%, transparent) 1px, transparent 1.5px) 0 0 / 14px 14px;
    color: var(--ink);
    font: 16px/1.5 var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .win {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 12px;
    box-shadow: 5px 5px 0 var(--ink);
    overflow: hidden;
  }
  .title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    background: var(--title);
    border-bottom: 2px solid var(--ink);
  }
  .count { font: 700 13px/1 var(--ui); white-space: nowrap; }
  .title h1 { display: flex; align-items: center; gap: 8px; margin: 0; font: 700 15px/1.4 var(--ui); letter-spacing: .02em; }
  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 14px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    font: 700 15px var(--ui);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .12s var(--press), box-shadow .12s var(--press), background-color .12s var(--press);
    cursor: pointer;
    touch-action: manipulation;
  }
  .key:active:not(:disabled), .key[aria-pressed="true"] { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .key[aria-pressed="true"] { background: var(--accent); }
  .key:disabled { border-style: dashed; box-shadow: none; color: var(--ink-soft); cursor: default; }
  .key:focus-visible { outline: 2px dotted var(--ink); outline-offset: -7px; }
  .tools { display: flex; gap: 8px; padding: 14px 14px 4px; }
  .tools .key { flex: 1; min-height: 48px; padding: 0; font-size: 20px; }
  .tools .ico { width: 20px; height: 20px; }
  textarea {
    display: block;
    flex: 1;
    min-height: 0;
    width: 100%;
    padding: 14px 16px 18px;
    border: 0;
    background: transparent;
    color: var(--ink);
    caret-color: var(--ink);
    font: 17px/1.65 var(--text);
    resize: none;
    outline: none;
  }
  textarea::placeholder { color: var(--ink-soft); }
  ::-webkit-scrollbar { width: 14px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  textarea::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink-soft); border: 3px solid transparent; border-radius: 7px; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:active { background-color: var(--ink); }
  @supports not selector(::-webkit-scrollbar) {
    html { scrollbar-color: var(--ink-soft) var(--bg); }
  }
  .foot {
    display: flex;
    gap: 8px;
    padding: 12px 14px 14px;
    background: var(--paper-deep);
    border-top: 2px solid var(--ink);
  }
  .foot .key { flex: 1; flex-direction: column; gap: 3px; min-height: 52px; padding: 6px 2px; font-size: 13px; }
  .note {
    width: 100%;
    max-width: 560px;
    margin: 12px auto 0;
    padding: 0 4px;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.6;
  }
  .toast {
    margin: 0 0 12px;
    padding: 8px 12px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 8px;
    box-shadow: 3px 3px 0 var(--ink);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.45;
  }
  .toast[hidden] { display: none; }
  .dock {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 0 calc(16px + env(safe-area-inset-bottom));
  }
  #type { display: none; }
  @media (pointer: coarse) {
    body:has(textarea:focus) :is(.note, .foot, #copy) { display: none; }
    body:has(textarea:focus) .dock { padding: 12px 0 0; }
  }
  body:has(textarea[readonly]) #type { display: inline-flex; margin-left: 4px; }
  #copy {
    width: 100%;
    min-height: 54px;
    gap: 10px;
    background: var(--accent);
    font-size: 17px;
    border-radius: 10px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  #copy .ico { width: 20px; height: 20px; }
  #copy:active:not(:disabled) { transform: translate(4px, 4px); }
  #copy:disabled { background: var(--paper-deep); box-shadow: none; }
  #copy.done { background: var(--paper); }
  @media (max-width: 360px) {
    body { padding: 16px 12px 0; }
    .tools { gap: 6px; padding: 12px 10px 4px; }
    .foot { gap: 6px; padding: 12px 10px 14px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <symbol id="i-pad" viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-11a1 1 0 0 1 -1 -1v-14a1 1 0 0 1 1 -1"/><path d="M9 4v16"/><path d="M13 8h2"/><path d="M13 12h2"/></symbol>
  <symbol id="i-plain" viewBox="0 0 24 24"><path d="M17 15l4 4m0 -4l-4 4"/><path d="M7 6v-1h11v1"/><path d="M7 19l4 0"/><path d="M13 5l-4 14"/></symbol>
  <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2"/><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M19 20h-10.5l-4.21 -4.3a1 1 0 0 1 0 -1.41l10 -10a1 1 0 0 1 1.41 0l5 5a1 1 0 0 1 0 1.41l-9.2 9.3"/><path d="M18 13.3l-6.3 -6.3"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></symbol>
  <symbol id="i-spacing" viewBox="0 0 24 24"><path d="M3 8l3 -3l3 3"/><path d="M3 16l3 3l3 -3"/><path d="M6 5l0 14"/><path d="M13 6l7 0"/><path d="M13 12l7 0"/><path d="M13 18l7 0"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z"/><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5l10 -10"/></symbol>
</svg>
<main class="win">
  <header class="title">
    <h1><svg class="ico"><use href="#i-pad"/></svg>Postpad</h1>
    <span class="count" id="count">0 chars</span>
  </header>
  <div class="tools" role="toolbar" aria-label="Text style">
    <button class="key" data-style="b" disabled aria-label="Bold" aria-pressed="false"><b>B</b></button>
    <button class="key" data-style="i" disabled aria-label="Italic" aria-pressed="false"><i>I</i></button>
    <button class="key" data-style="s" disabled aria-label="Strikethrough" aria-pressed="false"><s>S</s></button>
    <button class="key" data-style="u" disabled aria-label="Underline" aria-pressed="false"><u>U</u></button>
    <button class="key" data-style="plain" disabled aria-label="Remove formatting"><svg class="ico"><use href="#i-plain"/></svg></button>
    <button class="key" id="type" aria-label="Type"><svg class="ico"><use href="#i-edit"/></svg></button>
  </div>
  <textarea id="t" aria-label="Post text" placeholder="Type or paste your post, then select text to style it"></textarea>
  <div class="foot">
    <button class="key" id="paste"><svg class="ico"><use href="#i-paste"/></svg>Paste</button>
    <button class="key" id="clear" disabled><svg class="ico"><use href="#i-clear"/></svg>Clear</button>
    <button class="key" id="undo" disabled><svg class="ico"><use href="#i-undo"/></svg>Undo</button>
    <button class="key" id="spacing" disabled aria-label="Double spacing" aria-pressed="false"><svg class="ico"><use href="#i-spacing"/></svg>Spacing</button>
  </div>
</main>
<p class="note">Styles work on A-Z and 0-9 only. Italic skips numbers. Your draft stays on this device.</p>
<div class="dock">
  <p class="toast" id="toast" role="status" hidden></p>
  <button class="key" id="copy" disabled><svg class="ico"><use href="#i-copy"/></svg><span>Copy post</span></button>
</div>
<p class="sr-only" id="live" aria-live="polite"></p>
<script>
const LATIN = { b: [0x1D5D4, 0x1D5EE, 0x1D7EC], i: [0x1D608, 0x1D622], bi: [0x1D63C, 0x1D656] };
const MARK = { s: '̶', u: '̲' };
const graphemes = new Intl.Segmenter('th', { granularity: 'grapheme' });

function decode(ch) {
  const c = ch.codePointAt(0);
  for (const [kind, [up, low, dig]] of Object.entries(LATIN)) {
    const style = { b: kind !== 'i', i: kind !== 'b' };
    if (c >= up && c < up + 26) return { base: String.fromCharCode(65 + c - up), ...style };
    if (c >= low && c < low + 26) return { base: String.fromCharCode(97 + c - low), ...style };
    if (dig && c >= dig && c < dig + 10) return { base: String.fromCharCode(48 + c - dig), ...style };
  }
  const base = ch.normalize('NFKC');
  return /^[A-Za-z0-9]$/.test(base) ? { base, b: false, i: false } : null;
}

function encode({ base, b, i }) {
  const c = base.charCodeAt(0);
  if (c <= 57) return b ? String.fromCodePoint(LATIN.b[2] + c - 48) : base;
  const kind = b && i ? 'bi' : b ? 'b' : i ? 'i' : null;
  if (!kind) return base;
  const [up, low] = LATIN[kind];
  return String.fromCodePoint(c <= 90 ? up + c - 65 : low + c - 97);
}

function styleable(s, kind) {
  return [...s].map(decode).filter(x => x && (kind === 'b' || /[A-Za-z]/.test(x.base)));
}

function isOn(s, kind) {
  if (MARK[kind]) return s.includes(MARK[kind]);
  const chars = styleable(s, kind);
  return chars.length > 0 && chars.every(x => x[kind]);
}

function styleText(s, kind) {
  if (kind === 'plain') return s.normalize('NFKC').replace(/[̶̲]/g, '');
  const mark = MARK[kind];
  if (mark) {
    if (s.includes(mark)) return s.replaceAll(mark, '');
    return [...graphemes.segment(s)].map(({ segment: g }) => decode([...g][0]) ? g + mark : g).join('');
  }
  const on = !isOn(s, kind);
  return [...s].map(ch => {
    const x = decode(ch);
    return x && (kind === 'b' || /[A-Za-z]/.test(x.base)) ? encode({ ...x, [kind]: on }) : ch;
  }).join('');
}

function spacingOf(s) {
  const lines = s.split('\n').filter(line => line.trim());
  const double = lines.join('\n\n');
  return { count: lines.length, isDouble: lines.length > 1 && s === double, double, single: lines.join('\n') };
}

function keepWhitespace(s) {
  return s
    .split('\n')
    .map(line => line.trim() === '' ? '⠀' : line.replace(/^ +| {2,}/g, m => '⠀'.repeat(m.length)))
    .join('\n');
}

const t = document.getElementById('t');
const toast = document.getElementById('toast');
const live = document.getElementById('live');
const countEl = document.getElementById('count');
const styleBtns = [...document.querySelectorAll('[data-style]')];
const undoBtn = document.getElementById('undo');
const clearBtn = document.getElementById('clear');
const spacingBtn = document.getElementById('spacing');
const copyBtn = document.getElementById('copy');
const undoStack = [];
let saved = '';
let typing = false;

function say(message, btn) {
  toast.textContent = message;
  toast.hidden = false;
  if (btn && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    btn.animate([{ translate: '0' }, { translate: '-4px' }, { translate: '4px' }, { translate: '0' }], { duration: 260, easing: 'ease-out' });
  }
}

function unsay() {
  toast.hidden = true;
}

function sync() {
  const { count, isDouble } = spacingOf(t.value);
  const chars = [...graphemes.segment(t.value)].length;
  countEl.textContent = `${chars.toLocaleString('en-US')} ${chars === 1 ? 'char' : 'chars'}`;
  clearBtn.disabled = copyBtn.disabled = !t.value;
  spacingBtn.disabled = count < 2;
  spacingBtn.setAttribute('aria-pressed', isDouble);
  undoBtn.disabled = !undoStack.length;
  const sel = (document.activeElement === t || t.readOnly) && t.selectionStart !== t.selectionEnd ? t.value.slice(t.selectionStart, t.selectionEnd) : '';
  styleBtns.forEach(btn => {
    btn.disabled = !sel;
    if (btn.dataset.style !== 'plain') btn.setAttribute('aria-pressed', !!sel && isOn(sel, btn.dataset.style));
  });
}

function save() {
  if (!t.value) t.readOnly = false;
  saved = t.value;
  try { localStorage.setItem('draft', t.value); } catch {}
  sync();
}

function snapshot() {
  undoStack.push(t.value);
  if (undoStack.length > 50) undoStack.shift();
  typing = false;
}

try { t.value = localStorage.getItem('draft') || ''; } catch {}
save();

t.addEventListener('input', () => {
  if (!typing) {
    undoStack.push(saved);
    typing = true;
  }
  unsay();
  save();
});
document.addEventListener('selectionchange', sync);
['select', 'keyup', 'pointerup', 'focus', 'blur'].forEach(type => t.addEventListener(type, sync));
document.addEventListener('pointerdown', e => {
  unsay();
  if (t.readOnly && !e.target.closest('button, textarea')) t.setSelectionRange(t.selectionEnd, t.selectionEnd);
});
document.querySelectorAll('button').forEach(btn => btn.addEventListener('mousedown', e => e.preventDefault()));

styleBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const { selectionStart: a, selectionEnd: z, value } = t;
    const before = value.slice(a, z);
    const out = styleText(before, btn.dataset.style);
    if (out === before) {
      return say(btn.dataset.style === 'plain' ? 'Already plain text.' : 'Nothing to change here. Styles work on A-Z and 0-9 only, and Italic skips numbers.', btn);
    }
    snapshot();
    t.setRangeText(out, a, z, 'select');
    save();
    if (!t.readOnly) t.focus();
  });
});

t.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey) return;
  const btn = styleBtns.find(b => b.dataset.style === e.key.toLowerCase() && 'biu'.includes(e.key.toLowerCase()));
  if (!btn || btn.disabled) return;
  e.preventDefault();
  btn.click();
});

document.getElementById('paste').addEventListener('click', async () => {
  const text = await navigator.clipboard.readText().catch(() => null);
  if (text === null) return say('Paste was blocked. Long-press the text box and choose Paste.');
  if (!text) return say('The clipboard is empty.');
  snapshot();
  t.setRangeText(text, t.selectionStart, t.selectionEnd, 'end');
  save();
});

clearBtn.addEventListener('click', () => {
  snapshot();
  t.value = '';
  save();
});

spacingBtn.addEventListener('click', () => {
  const { isDouble, double, single } = spacingOf(t.value);
  snapshot();
  t.value = isDouble ? single : double;
  save();
});

undoBtn.addEventListener('click', () => {
  t.value = undoStack.pop();
  typing = false;
  save();
});

const vv = window.visualViewport;
const fitViewport = () => {
  document.body.style.height = vv.height + 'px';
  document.body.style.transform = vv.offsetTop ? `translateY(${vv.offsetTop}px)` : '';
};
vv?.addEventListener('resize', fitViewport);
vv?.addEventListener('scroll', fitViewport);

if (matchMedia('(pointer: coarse)').matches) {
  t.addEventListener('blur', () => { if (t.value) t.readOnly = true; });
  t.addEventListener('focus', () => { if (t.readOnly) t.blur(); });
  document.getElementById('type').addEventListener('click', () => {
    t.readOnly = false;
    t.focus();
  });
}

copyBtn.addEventListener('click', async () => {
  const ok = await navigator.clipboard.writeText(keepWhitespace(t.value)).then(() => true, () => false);
  if (!ok) return say("Couldn't copy. Select all the text and copy it by hand.", copyBtn);
  const [icon, label] = [copyBtn.querySelector('use'), copyBtn.querySelector('span')];
  icon.setAttribute('href', '#i-check');
  label.textContent = 'Copied! Ready to paste';
  copyBtn.classList.add('done');
  live.textContent = 'Copied. Ready to paste.';
  clearTimeout(copyBtn.timer);
  copyBtn.timer = setTimeout(() => {
    icon.setAttribute('href', '#i-copy');
    label.textContent = 'Copy post';
    copyBtn.classList.remove('done');
    live.textContent = '';
  }, 2200);
});
</script>
</body>
