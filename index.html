const THEME_VARS = ['bg', 'paper', 'paper-deep', 'ink', 'ink-soft', 'title', 'accent'];

function mixHex(a, b, t) {
  return a.match(/../g).map((h, k) => Math.round(parseInt(h, 16) * (1 - t) + parseInt(b.substr(k * 2, 2), 16) * t).toString(16).padStart(2, '0')).join('');
}

function applyTheme(i) {
  const colors = THEMES[i].split(' ');
  if (colors[5] === colors[6]) colors[5] = mixHex(colors[5], colors[1], .5);
  THEME_VARS.forEach((name, k) => document.documentElement.style.setProperty('--' + name, '#' + colors[k]));
  document.querySelector('meta[name="theme-color"]').content = '#' + colors[0];
  themeIcons(colors);
}

async function themeIcons([bg, paper, , ink, , title]) {
  try {
    const svg = (await (await fetch('icon.svg')).text())
      .replaceAll('#bcd0e8', '#' + bg).replaceAll('#f6eedc', '#' + paper)
      .replaceAll('#5a3b26', '#' + ink).replaceAll('#f29882', '#' + title);
    const img = new Image();
    img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
    await img.decode();
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 180;
    canvas.getContext('2d').drawImage(img, 0, 0, 180, 180);
    const png = canvas.toDataURL('image/png');
    document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(link => { link.href = png; });
  } catch {}
}

  let last = -1;
  try { last = Number(localStorage.getItem('theme')); } catch {}
  let i;
  do i = Math.floor(Math.random() * THEMES.length); while (i === last);
  try { localStorage.setItem('theme', i); } catch {}

<script>
const LATIN = { b: [0x1D5D4, 0x1D5EE, 0x1D7EC], i: [0x1D608, 0x1D622], bi: [0x1D63C, 0x1D656] };
const MARK = { s: '̶', u: '̲' };
const graphemes = new Intl.Segmenter('th', { granularity: 'grapheme' });

function decode(ch) {
  const c = ch.codePointAt(0);
  for (const [kind, [up, low, dig]] of Object.entries(LATIN)) {
    const style = { b: kind !== 'i', i: kind !== 'b' };
    if (c >= up && c < up + 26) return { base: String.fromCharCode(65 + c - up), ...style };
    if (c >= low && c < low + 26) return { base: String.fromCharCode(97 + c - low), ...style };
    if (dig && c >= dig && c < dig + 10) return { base: String.fromCharCode(48 + c - dig), ...style };
  }
  const base = ch.normalize('NFKC');
  return /^[A-Za-z0-9]$/.test(base) ? { base, b: false, i: false } : null;
}

function encode({ base, b, i }) {
  const c = base.charCodeAt(0);
  if (c <= 57) return b ? String.fromCodePoint(LATIN.b[2] + c - 48) : base;
  const kind = b && i ? 'bi' : b ? 'b' : i ? 'i' : null;
  if (!kind) return base;
  const [up, low] = LATIN[kind];
  return String.fromCodePoint(c <= 90 ? up + c - 65 : low + c - 97);
}

function styleable(s, kind) {
  return [...s].map(decode).filter(x => x && (kind === 'b' || /[A-Za-z]/.test(x.base)));
}

// ponytail: only sees the selection, so a selection inside a hashtag that leaves out its # still gets styled; match against the full text if that bites
const keepPlain = /(https?:\/\/\S+|www\.\S+|#[\p{L}\p{M}\p{N}_]+)/u;

function isOn(s, kind) {
  s = s.split(keepPlain).filter((_, n) => n % 2 === 0).join('');
  if (MARK[kind]) return s.includes(MARK[kind]);
  const chars = styleable(s, kind);
  return chars.length > 0 && chars.every(x => x[kind]);
}

function styleText(s, kind) {
  if (kind === 'plain') return s.normalize('NFKC').replace(/[̶̲]/g, '');
  const on = !isOn(s, kind);
  return s.split(keepPlain).map((part, n) => n % 2 ? part : restyle(part, kind, on)).join('');
}

function restyle(s, kind, on) {
  const mark = MARK[kind];
  if (mark) {
    if (!on) return s.replaceAll(mark, '');
    return [...graphemes.segment(s)].map(({ segment: g }) => decode([...g][0]) ? g + mark : g).join('');

  return s
    .split(lineBreak)
    .map(line => isBlank(line) ? '⠀' : line.replace(/^ +| {2,}/g, m => '⠀'.repeat(m.length)))
    .join('\n');

const t = document.getElementById('t');
const toast = document.getElementById('toast');
const live = document.getElementById('live');
const countEl = document.getElementById('count');
const styleBtns = [...document.querySelectorAll('[data-style]')];
const undoBtn = document.getElementById('undo');
const clearBtn = document.getElementById('clear');
const spacingBtn = document.getElementById('spacing');
const copyBtn = document.getElementById('copy');
const snippetBtn = document.getElementById('snippet');

  if (undoStack.length > 50) undoStack.shift();

  if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey) return;
  const btn = styleBtns.find(b => b.dataset.style === e.key.toLowerCase() && 'biu'.includes(e.key.toLowerCase()));
  if (!btn || btn.disabled) return;
  e.preventDefault();
  btn.click();

  const text = await navigator.clipboard.readText().catch(() => null);
  if (text === null) return say('Paste was blocked. Long-press the text box and choose Paste.');
  if (!text) return say('The clipboard is empty.');
  snapshot();
  t.setRangeText(text, t.selectionStart, t.selectionEnd, 'end');
  save();
});

clearBtn.addEventListener('click', () => {
  snapshot();
  t.value = '';
  save();
});

spacingBtn.addEventListener('click', () => {
  const { isDouble, double, single } = spacingOf(t.value);
  snapshot();
  t.value = isDouble ? single : double;
  save();
});

snippetBtn.addEventListener('click', () => {
  const sel = selected();
  if (sel) {
    if (sel === snippet) return say('This is already your snippet.');
    snippet = sel;
    try { localStorage.setItem('snippet', snippet); } catch {}
    return say('Saved as your snippet. Press Saved with nothing selected to add it to the end of a post.');
  }
  if (!snippet) return say('No snippet yet. Select text you reuse, like delivery and pickup details, then press Saved to keep it.', snippetBtn);

  t.value = undoStack.pop();

  revealCaret();
  if (t.readOnly || !(vv.height < restHeights[Math.round(vv.width)] - 100)) return;
  typingHeights[Math.round(vv.width)] = t.clientHeight;
  try { localStorage.setItem('typingHeights', JSON.stringify(typingHeights)); } catch {}
});
vv?.addEventListener('scroll', fitViewport);
vv && fitViewport();

if (matchMedia('(pointer: coarse)').matches) {
  t.addEventListener('blur', () => {
    t.style.paddingBottom = '';
    const rest = restHeights[Math.round(vv.width)];
    if (!rest || vv.scale > 1.01) return;
    document.body.classList.add('kb-closing');
    if (innerHeight > rest - 100) setHeight(rest);
    document.body.style.transform = '';
    clearTimeout(fitViewport.timer);
    fitViewport.timer = setTimeout(() => {
      document.body.classList.remove('kb-closing');
      fitViewport();
      reveal();
    }, 700);
  });
  const dropSelection = () => {
    t.setSelectionRange(t.selectionEnd, t.selectionEnd);
    sync();
  };
  t.addEventListener('blur', () => {
    if (!t.value || t.readOnly) return;
    const top = t.scrollTop;
    t.readOnly = true;
    dropSelection();
    t.scrollTop = top;
  });
  t.readOnly = !!t.value;
  sync();
  const reveal = () => {
    if (!document.body.classList.contains('kb-hiding') || reveal.pending) return;
    reveal.pending = true;
    clearTimeout(fitViewport.timer);
    document.body.classList.remove('kb-closing');
    fitViewport();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      reveal.pending = false;
      document.body.classList.remove('kb-hiding');
    }));
  };
  t.addEventListener('blur', () => {
    const rest = restHeights[Math.round(vv.width)];
    if (!rest || vv.scale > 1.01 || vv.height > rest - 100) return;
    reveal.rest = rest;
    document.body.classList.add('kb-hiding');
  });
  vv.addEventListener('resize', () => {
    clearTimeout(reveal.settle);
    if (document.activeElement !== t && vv.height >= reveal.rest - 4) reveal.settle = setTimeout(reveal, 80);
  });
  let keyboardUp = false;
  vv.addEventListener('resize', () => {
    const rest = restHeights[Math.round(vv.width)];
    if (document.activeElement !== t || !rest) return;
    if (vv.height < rest - 100) keyboardUp = true;
    else if (keyboardUp) t.blur();
  });
  t.addEventListener('blur', () => { keyboardUp = false; });
  t.addEventListener('focus', () => {
    document.body.classList.remove('kb-hiding');
    document.body.classList.remove('kb-closing');
    if (!t.readOnly) return;
    t.blur();
    dropSelection();
  });
  const keyboardHandoff = Object.assign(document.createElement('input'), { tabIndex: -1, ariaLabel: 'Post text' });
  keyboardHandoff.style.cssText = 'position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0';
  document.body.append(keyboardHandoff);
  document.getElementById('type').addEventListener('click', () => {
    if (document.activeElement === t && !t.readOnly) return t.blur();
    const caretBottom = caretBottomAt(t.selectionEnd);
    keyboardHandoff.focus();
    t.readOnly = false;
    t.style.paddingBottom = t.clientHeight + 'px';
    const typingHeight = typingHeights[Math.round(vv.width)];
    t.scrollTop = typingHeight ? caretBottom - typingHeight : caretBottom - 60;
    t.focus();
  });
}

if (vv && new URLSearchParams(location.search).has('debug')) {
  const box = document.createElement('pre');
  box.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; z-index: 9; margin: 0; padding: 4px; font: 10px/1.3 monospace; background: #000c; color: #0f0; pointer-events: none; white-space: pre-wrap';
  document.documentElement.append(box);
  const lines = [];
  let t0 = performance.now();
  const snap = e => `${Math.round(performance.now() - t0)} ${e} vv${Math.round(vv.height)} top${Math.round(vv.offsetTop)} in${innerHeight} b${parseInt(document.body.style.height) || 0} st${Math.round(t.scrollTop)} ${document.body.className}`;
  const log = e => {
    if (e === 'blur' || e === 'focus') t0 = performance.now();
    lines.push(snap(e));
    lines.splice(0, lines.length - 16);
    if (location.protocol === 'http:') fetch('/log', { method: 'POST', body: lines.at(-1), keepalive: true }).catch(() => {});
  };
  t.addEventListener('focus', () => log('focus'));
  t.addEventListener('blur', () => log('blur'));
  vv.addEventListener('resize', () => log('vvR'));
  vv.addEventListener('scroll', () => log('vvS'));
  addEventListener('resize', () => log('winR'));
  new MutationObserver(() => log('body')).observe(document.body, { attributes: true });
  (function frame() {
    box.textContent = lines.join('\n') + '\n' + snap('now');
    requestAnimationFrame(frame);
  })();
}

copyBtn.addEventListener('click', async () => {
  const ok = await navigator.clipboard.writeText(keepWhitespace(t.value)).then(() => true, () => false);
  if (!ok) return say("Couldn't copy. Select all the text and copy it by hand.", copyBtn);
  const [icon, label] = [copyBtn.querySelector('use'), copyBtn.querySelector('span')];
  icon.setAttribute('href', '#i-check');
  label.textContent = 'Copied! Ready to paste';
  copyBtn.classList.add('done');
  live.textContent = 'Copied. Ready to paste.';
  clearTimeout(copyBtn.timer);
  copyBtn.timer = setTimeout(() => {
    icon.setAttribute('href', '#i-copy');
    label.textContent = 'Copy post';
    copyBtn.classList.remove('done');
    live.textContent = '';
  }, 2200);
});
</script>
</body>
</html>
